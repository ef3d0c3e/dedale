[package]
name = "dedale-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dedale = { path = "../crates/dedale" }
dedale-core = { path = "../crates/dedale-core" }
libfuzzer-sys = "0.4"

# Not part of the main workspace: fuzzing needs nightly.
[workspace]
members = ["."]

[[bin]]
name = "map_parse"
path = "fuzz_targets/map_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "maze_code"
path = "fuzz_targets/maze_code.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generate"
path = "fuzz_targets/generate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine"
path = "fuzz_targets/engine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bot_line"
path = "fuzz_targets/bot_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_read"
path = "fuzz_targets/replay_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false
