# Every quality gate of scripts/check.sh, on each push to master and each
# pull request: rustfmt, clippy, the Rust and Python tests, the web checks,
# the browser end to end, cargo-deny, actionlint, all with the runner's
# Python 3.12. Plus the harness on the other Pythons it supports, and a
# macOS build that plays a game. Weekly, all of it again (new advisories,
# runner changes) and every fuzz target. The release workflow calls it
# first. Third-party actions are pinned by commit.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so that a new release's lints (clippy runs with -D warnings) only
  # arrive when this is bumped; scripts/check.sh also checks the runner's
  # latest stable compiles. It is the workspace's declared `rust-version`
  # too (scripts/check.sh checks they agree): bump both together.
  RUST_VERSION: "1.95.0"

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The sandbox tests must run here rather than skip.
      DEDALE_REQUIRE_SANDBOX: "1"
      # The runner's Chrome, for the end-to-end tests.
      DEDALE_CHROMIUM: google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}, with rustfmt and clippy
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: actionlint
        # A pinned release, checked against its hash; scripts/check.sh runs
        # it (with the runner's shellcheck on the scripts).
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${file}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$file" -C "$RUNNER_TEMP/bin" actionlint
          rm "$file"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 keeps unprivileged programs such as bubblewrap from
          # creating user namespaces; the sandbox needs them.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Versions
        run: |
          rustc --version
          node --version
          python3 --version
          bwrap --version
          "$DEDALE_CHROMIUM" --version
          cargo deny --version

      - name: scripts/check.sh
        run: scripts/check.sh

  # The tests read /proc and run the Linux sandbox, so macOS gets a build and
  # a real game instead: enough to catch what would break its prebuilt binary.
  macos:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked --bin dedale

      - name: Python tests
        working-directory: bindings/python
        run: python3 -m unittest discover -s tests -t .

      - name: Play a game
        run: |
          target/debug/dedale run examples/python/greedy_bot.py examples/python/tour_bot.py \
              --max-turns 100 --out "$RUNNER_TEMP/game"
          target/debug/dedale replay --verify "$RUNNER_TEMP/game/replay.json"

  # The harness supports Python 3.10 and later; the job above runs 3.12.
  # Here, the others: the harness's tests, the Rust tests that drive Python
  # bots (timeouts, crashes, errors, marks), and a game.
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Python tests
        working-directory: bindings/python
        run: python -m unittest discover -s tests -t .

      - name: Rust tests with Python bots
        env:
          DEDALE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --locked --all-features --test python --test about --test cli

      - name: Play a game
        env:
          DEDALE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          cargo build --locked --bin dedale
          target/debug/dedale run examples/python/greedy_bot.py examples/python/rollout_bot.py \
              --max-turns 200 --out "$RUNNER_TEMP/game"
          target/debug/dedale replay --verify "$RUNNER_TEMP/game/replay.json"

  # The sandbox's seccomp filter has its own system call numbers for each
  # processor: its tests on arm64 too, where the release builds a binary.
  sandbox-arm:
    name: Sandbox on arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DEDALE_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Sandbox tests
        run: |
          cargo test --locked --all-features --lib -- sandbox:: seccomp::
          cargo test --locked --all-features --test sandbox

  # Weekly and by hand: every fuzz target for three minutes on nightly,
  # from its seeds. A crash fails the job and keeps the input that caused it.
  fuzz:
    name: Fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz
        run: scripts/fuzz.sh 180

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
