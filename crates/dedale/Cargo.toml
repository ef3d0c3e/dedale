[package]
name = "dedale"
description = "Referee for maze bots: runs competitor programs against each other in a symmetric maze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "dedale"

[features]
# Builds dedale-fake-bot, the scripted raw-protocol bot the tests drive.
fake-bot = []

[[bin]]
name = "dedale"
path = "src/main.rs"

[[bin]]
name = "dedale-fake-bot"
path = "src/bin/dedale-fake-bot.rs"
required-features = ["fake-bot"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dedale-core.workspace = true
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
